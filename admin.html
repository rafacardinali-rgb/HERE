<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>HERE — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0B0B0F;--bg-el:#16161C;--card:#1B1B22;
      --ink:#FAFAFA;--ink-soft:#C9C9D1;--ink-muted:#7A7A85;
      --border:#26262F;--accent:#FF5864;--like:#3DDC8B;
    }
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5}

    /* ── LOGIN ── */
    #page-login{display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:24px}
    .login-box{width:100%;max-width:380px}
    .login-logo{font-size:36px;font-weight:900;letter-spacing:-1.5px;color:var(--accent);margin-bottom:4px}
    .login-sub{font-size:13px;color:var(--ink-muted);margin-bottom:32px}
    .login-label{font-size:12px;font-weight:700;color:var(--ink-muted);margin-bottom:6px;display:block;margin-top:16px}
    .login-input{background:var(--bg-el);border:1px solid var(--border);border-radius:12px;
      padding:13px 16px;font-size:15px;color:var(--ink);width:100%;outline:none;font-family:inherit;transition:border-color .15s}
    .login-input::placeholder{color:var(--ink-muted)}
    .login-input:focus{border-color:var(--accent)}
    .login-btn{background:var(--accent);color:#fff;border:none;border-radius:12px;
      padding:14px 24px;font-size:15px;font-weight:800;cursor:pointer;width:100%;margin-top:24px;
      transition:opacity .15s}
    .login-btn:hover{opacity:.88}
    .login-btn:disabled{opacity:.5;cursor:default}
    .login-err{color:var(--accent);font-size:13px;font-weight:700;margin-top:12px;min-height:18px}

    /* ── DASHBOARD ── */
    #page-dash{display:none;flex-direction:column;min-height:100vh}
    .dash-header{background:var(--bg-el);border-bottom:1px solid var(--border);
      padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:0;z-index:10}
    .dash-logo{font-size:20px;font-weight:900;letter-spacing:-.5px;color:var(--accent)}
    .dash-header-right{display:flex;align-items:center;gap:12px}
    .logout-btn{background:var(--card);border:1px solid var(--border);color:var(--ink-muted);
      border-radius:10px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;
      transition:color .15s}
    .logout-btn:hover{color:var(--ink)}

    .dash-body{padding:32px 28px;max-width:960px;margin:0 auto;width:100%}

    .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:36px}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px 24px}
    .stat-num{font-size:42px;font-weight:900;letter-spacing:-1.5px;color:var(--accent);line-height:1}
    .stat-label{font-size:13px;color:var(--ink-muted);font-weight:600;margin-top:6px}

    .section-title{font-size:18px;font-weight:800;margin-bottom:16px;color:var(--ink)}

    .search-bar{background:var(--bg-el);border:1px solid var(--border);border-radius:12px;
      padding:11px 16px;font-size:14px;color:var(--ink);width:100%;max-width:320px;
      outline:none;font-family:inherit;margin-bottom:20px;transition:border-color .15s}
    .search-bar::placeholder{color:var(--ink-muted)}
    .search-bar:focus{border-color:var(--accent)}

    .list-wrap{display:flex;flex-direction:column;gap:8px}
    .member-row{background:var(--card);border:1px solid var(--border);border-radius:16px;
      padding:14px 18px;display:flex;align-items:center;gap:14px;
      transition:border-color .2s}
    .member-row:hover{border-color:rgba(255,88,100,.25)}
    .member-avatar{width:44px;height:44px;border-radius:50%;background:var(--bg-el);
      border:1px solid var(--border);display:flex;align-items:center;justify-content:center;
      font-size:18px;font-weight:800;color:var(--accent);flex-shrink:0;overflow:hidden}
    .member-avatar img{width:100%;height:100%;object-fit:cover}
    .member-info{flex:1;min-width:0}
    .member-name{font-size:15px;font-weight:700;color:var(--ink);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .member-email{font-size:12px;color:var(--ink-muted);margin-top:2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .member-date{font-size:11px;color:var(--ink-muted);white-space:nowrap;flex-shrink:0}

    .member-num{font-size:12px;font-weight:700;color:var(--ink-muted);width:28px;
      text-align:right;flex-shrink:0}

    .empty-state{text-align:center;padding:60px 24px;color:var(--ink-muted)}
    .empty-state .big{font-size:40px;margin-bottom:12px}

    .loading-row{display:flex;align-items:center;justify-content:center;
      padding:40px;color:var(--ink-muted);font-size:14px}
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="page-login">
  <div class="login-box">
    <div class="login-logo">here</div>
    <div class="login-sub">Panel de administración</div>
    <label class="login-label">Email</label>
    <input class="login-input" id="login-email" type="email" placeholder="tu@email.com" autocomplete="email"/>
    <label class="login-label">Contraseña</label>
    <input class="login-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"
           onkeydown="if(event.key==='Enter') doLogin()"/>
    <div class="login-err" id="login-err"></div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Ingresar</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="page-dash">
  <header class="dash-header">
    <span class="dash-logo">here · admin</span>
    <div class="dash-header-right">
      <span id="dash-user" style="font-size:13px;color:var(--ink-muted)"></span>
      <button class="logout-btn" onclick="doLogout()">Salir</button>
    </div>
  </header>
  <div class="dash-body">
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-num" id="stat-total">–</div>
        <div class="stat-label">Inscriptos totales</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-today" style="color:var(--like)">–</div>
        <div class="stat-label">Hoy</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="stat-week" style="color:#A78BFA">–</div>
        <div class="stat-label">Esta semana</div>
      </div>
    </div>

    <div class="section-title">Lista de inscriptos</div>
    <input class="search-bar" id="search-input" type="text" placeholder="Buscar por nombre o email…"
           oninput="filterList()"/>
    <div class="list-wrap" id="member-list">
      <div class="loading-row">Cargando…</div>
    </div>
  </div>
</div>

<script>
  const SB_URL = 'https://qxtlmatcwflbexmpxmqq.supabase.co';
  const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4dGxtYXRjd2ZsYmV4bXB4bXFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczOTk4NjAsImV4cCI6MjA5Mjk3NTg2MH0.aRv-cXdQ3vYkI5hfWtbXcCYWpi8F8ZL_zzyc-290Z2k';
  const sb = supabase.createClient(SB_URL, SB_KEY);

  let allMembers = [];

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-err');
    const btn   = document.getElementById('login-btn');
    errEl.textContent = '';
    if (!email || !pass) { errEl.textContent = 'Completá email y contraseña.'; return; }
    btn.disabled = true; btn.textContent = 'Ingresando…';
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) {
      errEl.textContent = 'Email o contraseña incorrectos.';
      btn.disabled = false; btn.textContent = 'Ingresar';
    } else {
      showDash();
    }
  }

  async function doLogout() {
    await sb.auth.signOut();
    document.getElementById('page-dash').style.display = 'none';
    document.getElementById('page-login').style.display = 'flex';
    document.getElementById('login-pass').value = '';
    document.getElementById('login-err').textContent = '';
    document.getElementById('login-btn').disabled = false;
    document.getElementById('login-btn').textContent = 'Ingresar';
  }

  async function showDash() {
    document.getElementById('page-login').style.display = 'none';
    document.getElementById('page-dash').style.display = 'flex';
    const { data: { user } } = await sb.auth.getUser();
    if (user) document.getElementById('dash-user').textContent = user.email;
    await loadMembers();
  }

  async function loadMembers() {
    const { data, error } = await sb.from('waitlist')
      .select('id,name,email,avatar_url,created_at')
      .order('created_at', { ascending: false });

    if (error) {
      document.getElementById('member-list').innerHTML =
        '<div class="loading-row">Error al cargar datos.</div>';
      return;
    }

    allMembers = data || [];
    updateStats();
    renderList(allMembers);
  }

  function updateStats() {
    document.getElementById('stat-total').textContent = allMembers.length;
    const now = new Date();
    const todayStr = now.toISOString().slice(0,10);
    const weekAgo = new Date(now - 7 * 86400000).toISOString();
    const today = allMembers.filter(m => m.created_at.startsWith(todayStr)).length;
    const week  = allMembers.filter(m => m.created_at >= weekAgo).length;
    document.getElementById('stat-today').textContent = today;
    document.getElementById('stat-week').textContent  = week;
  }

  function renderList(members) {
    const el = document.getElementById('member-list');
    if (!members.length) {
      el.innerHTML = '<div class="empty-state"><div class="big">📋</div>Todavía no hay inscriptos.</div>';
      return;
    }
    el.innerHTML = members.map((m, i) => {
      const initials = m.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      const avatar = m.avatar_url
        ? `<img src="${m.avatar_url}" alt="${m.name}"/>`
        : initials;
      const date = new Date(m.created_at).toLocaleDateString('es-AR', {
        day:'2-digit', month:'short', year:'numeric'
      });
      return `
        <div class="member-row">
          <div class="member-num">${members.length - i}</div>
          <div class="member-avatar">${avatar}</div>
          <div class="member-info">
            <div class="member-name">${esc(m.name)}</div>
            <div class="member-email">${esc(m.email)}</div>
          </div>
          <div class="member-date">${date}</div>
        </div>`;
    }).join('');
  }

  function filterList() {
    const q = document.getElementById('search-input').value.toLowerCase();
    if (!q) { renderList(allMembers); return; }
    renderList(allMembers.filter(m =>
      m.name.toLowerCase().includes(q) || m.email.toLowerCase().includes(q)
    ));
  }

  function esc(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Restaurar sesión si ya estaba logueado
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session) showDash();
  });
</script>
</body>
</html>
